<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ling Panda Maiden Tournament Overlay | LOY Software</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--ink:rgba(10,9,14,.96);--ink2:rgba(20,16,25,.92);--pink:#ff5ca8;--rose:#ff9dca;--plum:#9b5de5;--gold:#e7b95a;--gold2:#ffe6a6;--white:#fff8fc;--muted:#c9b8c4;--bronze:#b06a4c;--bronze2:#e8a37e;--cream:#f3e2d2;--ember:#d8b58f}
    *{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;background:transparent!important;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:var(--white)}
    .shell{position:absolute;inset:0;pointer-events:none}.brand{position:absolute;top:-13px;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;padding:5px 18px;border:1px solid var(--gold);border-radius:999px;background:linear-gradient(90deg,rgba(8,8,12,.96),rgba(40,18,34,.96),rgba(8,8,12,.96));color:var(--rose);font-weight:900;font-size:11px;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 0 20px rgba(255,92,168,.2)}.brand:before{content:"🐾  "}.brand:after{content:"  ✝";color:var(--gold2)}
    .top{position:absolute;top:38px;left:50%;transform:translateX(-50%);width:min(1400px,94vw);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;filter:drop-shadow(0 16px 28px rgba(0,0,0,.6))}
    .player{position:relative;min-width:0;min-height:96px;background:linear-gradient(160deg,rgba(28,14,9,.96),rgba(10,6,5,.98));border:1px solid var(--bronze);box-shadow:0 0 0 5px rgba(8,5,4,.92),0 0 0 6px rgba(176,106,76,.55),0 0 28px rgba(232,163,126,.22);display:flex;align-items:center;justify-content:center;text-align:center}
    .player:before{content:"";position:absolute;inset:8px;border:1px solid rgba(232,163,126,.35);pointer-events:none}
    .player:after{content:"◆";position:absolute;top:-10px;left:50%;transform:translateX(-50%);color:var(--bronze2);font-size:13px;text-shadow:0 0 10px rgba(232,163,126,.9)}
    .inner{position:relative;z-index:1;width:100%;display:flex;align-items:center;gap:16px;padding:12px 16px}
    .pinfo{flex:1;min-width:0}
    .p1 .pinfo{text-align:left}.p2 .pinfo{text-align:right}
    .p1 .sep{margin:7px auto 7px 0}.p2 .sep{margin:7px 0 7px auto}
    .pscore{flex:none;width:58px;height:58px;display:grid;place-items:center;border:1px solid var(--bronze);box-shadow:0 0 0 3px rgba(8,5,4,.9),0 0 0 4px rgba(176,106,76,.5),0 0 16px rgba(232,163,126,.3);background:radial-gradient(circle at center,rgba(122,60,40,.3),rgba(10,6,5,.97) 75%);font-family:"Cinzel",serif;font-size:29px;font-weight:900;color:#f0bd8d;text-shadow:0 0 12px rgba(232,163,126,.5)}
    .name{font-family:"Cinzel",serif;font-size:clamp(16px,1.5vw,26px);font-weight:700;letter-spacing:.04em;color:var(--cream);text-shadow:0 0 16px rgba(232,163,126,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sep{width:58%;height:1px;margin:7px auto;background:linear-gradient(90deg,transparent,var(--bronze),transparent);position:relative}
    .sep:after{content:"✦";position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--bronze2)}
    .char{font-family:"Cinzel",serif;font-size:clamp(12px,1.05vw,15px);letter-spacing:.08em;text-transform:uppercase;color:#dcc0a2;text-shadow:0 0 10px rgba(232,163,126,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .panda{position:absolute;bottom:-15px;font-size:34px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.7))}
    .p1 .panda{left:-10px}.p2 .panda{right:-10px}
    .ticker{width:100%;min-width:300px;margin-top:7px;padding:4px 14px;border-top:1px solid rgba(232,163,126,.45);border-bottom:1px solid rgba(232,163,126,.45);background:linear-gradient(90deg,transparent,rgba(122,60,40,.3),transparent);text-align:center;overflow:hidden}
    .ticker span{display:inline-block;width:100%;font-family:"Cinzel",serif;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ember);text-shadow:0 0 10px rgba(232,163,126,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .45s ease,transform .45s ease}
    .ticker.swap span{opacity:0;transform:translateY(8px)}
    .scoreboard{position:relative;min-width:0;width:max-content;padding:14px 26px 0;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(122,60,40,.28),rgba(10,6,5,.97) 72%);border:1px solid var(--bronze);box-shadow:0 0 0 6px rgba(8,5,4,.92),0 0 0 7px rgba(176,106,76,.55),0 0 36px rgba(232,163,126,.3)}
    .scoreboard:after{content:"◆";position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);color:var(--bronze2);font-size:15px;text-shadow:0 0 12px rgba(232,163,126,.95)}
    .bestof{font-family:"Cinzel",serif;color:var(--ember);font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
    .bottom{display:none;position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(1500px,94vw);height:66px;grid-template-columns:1.7fr 1fr 230px 1.7fr;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))}
    .seg,.mini-score{background:linear-gradient(180deg,rgba(28,14,9,.96),rgba(10,6,5,.97));border-top:1px solid var(--bronze);border-bottom:1px solid var(--bronze);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
    .seg:first-child{border-left:1px solid var(--bronze)}.seg:last-child{border-right:1px solid var(--bronze)}
    .seg:after{content:"";position:absolute;bottom:0;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,var(--bronze2),transparent)}
    .title{font-family:"Cinzel",serif;font-weight:700;letter-spacing:.05em;color:var(--cream);text-shadow:0 0 12px rgba(232,163,126,.3);font-size:clamp(15px,1.5vw,22px)}
    .sub{font-family:"Cinzel",serif;color:var(--ember);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
    .mini-score{border:1px solid var(--bronze);gap:12px;font-family:"Cinzel",serif;font-weight:900;font-size:32px;color:#f6cd9f;text-shadow:0 0 14px rgba(232,163,126,.5);background:radial-gradient(circle at center,rgba(122,60,40,.28),rgba(10,6,5,.97) 70%)}
    .vs{color:var(--bronze2);font-size:18px}
    .location{color:#a9855f;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
    @media(max-width:900px){.top{width:98vw;gap:8px}.player{min-height:70px}.player:before{inset:5px}.inner{padding:8px 10px;gap:10px}.pscore{width:42px;height:42px;font-size:20px}.name{font-size:15px}.char{font-size:10px}.sep{margin:6px auto}.panda{font-size:22px;bottom:-11px}.ticker{min-width:210px;margin-top:5px}.ticker span{font-size:10px}.scoreboard{height:78px;padding-top:12px}.bestof{font-size:8px}.bottom{height:54px;width:98vw;grid-template-columns:1.4fr .9fr 150px 1.4fr}.title{font-size:12px}.sub,.location{font-size:9px}.mini-score{font-size:22px}.vs{font-size:13px}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <section class="player p1"><div class="inner"><div class="pinfo"><div class="name" id="p1Name">Player 1</div><div class="sep"></div><div class="char" id="p1Char">Character TBD</div></div><div class="pscore"><span id="p1Score">0</span></div></div><span class="panda">🐼</span></section>
      <div class="scoreboard"><div class="brand">Lambs_Shadow Tournament</div><div class="bestof" id="bestOf">Best of 3</div><div class="ticker" id="ticker"><span id="tickerText">Waiting for Players</span></div></div>
      <section class="player p2"><div class="inner"><div class="pscore"><span id="p2Score">0</span></div><div class="pinfo"><div class="name" id="p2Name">Player 2</div><div class="sep"></div><div class="char" id="p2Char">Character TBD</div></div></div><span class="panda">🐼</span></section>
    </div>
    <div class="bottom">
      <div class="seg"><div class="title" id="tournamentName">Tekken 8 Tournament</div></div>
      <div class="seg"><div class="sub" id="roundBottom">Waiting</div></div>
      <div class="mini-score"><span id="p1ScoreBottom">0</span><span class="vs">VS</span><span id="p2ScoreBottom">0</span></div>
      <div class="seg"><div class="location">ttv lambs_shadow • Faith • Focus • Fight</div></div>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket=io();
    let tickerRound='Waiting for Players',tickerName='Tekken 8 Tournament',tickerFlip=false;
    const ticker=document.getElementById('ticker'),tickerText=document.getElementById('tickerText');
    const named=s=>{const n=(s||'').trim().toLowerCase();return n!==''&&n!=='player 1'&&n!=='player 2'};
    function update(state){if(!state)return;const tn=state.tournamentName||'Tekken 8 Tournament',r=state.round||'Waiting',a=state.p1?.score??0,b=state.p2?.score??0;const ready=state.status==='live'||state.status==='finished'||(named(state.p1?.name)&&named(state.p2?.name));tickerRound=ready?r:'Waiting for Players';tickerName=tn;tickerText.textContent=tickerFlip?tickerName:tickerRound;document.getElementById('tournamentName').textContent=tn;document.getElementById('roundBottom').textContent=r;document.getElementById('bestOf').textContent='Best of '+(state.bestOf||3);document.getElementById('p1Name').textContent=state.p1?.name||'Player 1';document.getElementById('p1Char').textContent=state.p1?.character||'Character TBD';document.getElementById('p1Score').textContent=a;document.getElementById('p1ScoreBottom').textContent=a;document.getElementById('p2Name').textContent=state.p2?.name||'Player 2';document.getElementById('p2Char').textContent=state.p2?.character||'Character TBD';document.getElementById('p2Score').textContent=b;document.getElementById('p2ScoreBottom').textContent=b}
    setInterval(()=>{ticker.classList.add('swap');setTimeout(()=>{tickerFlip=!tickerFlip;tickerText.textContent=tickerFlip?tickerName:tickerRound;ticker.classList.remove('swap')},450)},5000);
    socket.on('connect',()=>socket.emit('requestState'));socket.on('matchUpdate',update);
  </script>
</body>
</html>
